<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        gap: 20px;
      }

      #kvadraten {
        display: flex;
        justify-content: center;
        align-items: center;

        width: 300px;
        height: 300px;

        background-color: blue;
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="kvadraten">kvadraten</div>
    <button onclick="randomColor()">RaNdOmCoLoRs</button>

    <script>
      const rutan = document.getElementById("kvadraten");

      function randomColor() {
        const r = Math.floor(Math.random() * 256);
        const g = Math.floor(Math.random() * 256);
        const b = Math.floor(Math.random() * 256);

        rutan.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
      }
    </script>
  </body>
</html>
